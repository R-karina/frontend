<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend 2.0</title>
</head>
<body>

    <h1>Версия 2.0</h1>

    <!-- Первое поле -->
    <input type="text" id="text1" placeholder="Введите данные">
    <button id="sendButton1">Отправить</button>

    <br><br>

    <!-- Второе поле -->
    <input type="text" id="text2" placeholder="Введите дополнительные данные">
    <button id="sendButton2">Отправить</button>

    <br><br>

    <!-- Третье поле для вывода содержимого файла -->
    <textarea id="result"
          rows="10"
          cols="40"
          placeholder="Данные из файла"
          readonly></textarea>
    <button id="getButton">Получить</button>


    <script>

        // Первое поле
        const text1 = document.getElementById("text1");
        const sendButton1 = document.getElementById("sendButton1");


        // Второе поле
        const text2 = document.getElementById("text2");
        const sendButton2 = document.getElementById("sendButton2");


        // Третье поле
        const result = document.getElementById("result");
        const getButton = document.getElementById("getButton");


        // Первая кнопка — отправка данных
        sendButton1.addEventListener("click", async () => {

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/api/data",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            text: text1.value
                        })
                    }
                );

                const data = await response.json();

                alert(data.message);

            } catch (error) {
                alert("Ошибка: " + error);
            }
        });


        // Вторая кнопка — отправка дополнительных данных
        sendButton2.addEventListener("click", async () => {

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/api/data",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            text: text2.value
                        })
                    }
                );

                const data = await response.json();

                alert(data.message);

            } catch (error) {
                alert("Ошибка: " + error);
            }
        });


        // Третья кнопка — получение данных из файла
        getButton.addEventListener("click", async () => {

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/api/data"
                );

                const data = await response.json();

                result.value = data.data;

            } catch (error) {
                result.value = "Ошибка: " + error;
            }
        });

    </script>

</body>
</html>
